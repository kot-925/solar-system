<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Солнечная система</title>
<link rel="icon" href="icons/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="icons/favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Солнечная система">
<style>
  :root {
    --bg: #000;
    --panel: rgba(12, 14, 20, 0.62);
    --panel-border: rgba(255, 255, 255, 0.09);
    --text: #e9ecf2;
    --muted: #8c93a3;
    --accent: #ffcf7a;
    --radius: 14px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
  #scene { position: fixed; inset: 0; }
  #scene canvas { display: block; outline: none; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  button { font: inherit; color: inherit; }

  .panel {
    position: fixed; z-index: 5;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
  }

  /* Заголовок и дата */
  #header { top: 16px; left: 16px; padding: 12px 16px; }
  #header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  #date { margin-top: 2px; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }

  /* Список тел */
  #bodies { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent; top: 92px; left: 16px; padding: 6px; width: 176px; max-height: calc(100% - 200px); overflow-y: auto; }
  #bodies button {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 6px 10px; border: 0; border-radius: 9px; background: transparent; cursor: pointer; text-align: left;
  }
  #bodies button:hover { background: rgba(255, 255, 255, 0.07); }
  #bodies button.active { background: rgba(255, 207, 122, 0.16); color: var(--accent); }
  #bodies button.moon { padding-left: 28px; font-size: 13px; color: #c5cad6; }
  #bodies button.moon.active { color: var(--accent); }
  #bodies .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: 0 0 6px currentColor; }

  /* Настройки */
  #settings { top: 16px; right: 16px; padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 260px); }
  .chip {
    border: 1px solid var(--panel-border); background: rgba(255, 255, 255, 0.04);
    padding: 6px 11px; border-radius: 9px; cursor: pointer; white-space: nowrap; font-size: 13px;
  }
  .chip:hover { background: rgba(255, 255, 255, 0.1); }
  .chip[aria-pressed="true"] { background: rgba(255, 207, 122, 0.16); border-color: rgba(255, 207, 122, 0.35); color: var(--accent); }

  /* Управление временем */
  #time { bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 10px; display: flex; align-items: center; gap: 8px; }
  #time .icon { width: 36px; height: 34px; padding: 0; display: grid; place-items: center; font-size: 15px; }
  #speed { width: 170px; accent-color: var(--accent); }
  #speedLabel { min-width: 116px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }

  /* Карточка объекта */
  #card { top: 72px; right: 16px; width: 320px; max-height: calc(100% - 160px); overflow-y: auto; padding: 18px 18px 16px;
    transition: opacity .35s, transform .35s; }
  #card.hidden { opacity: 0; transform: translateX(24px); pointer-events: none; }
  #card h2 { margin: 0; font-size: 22px; font-weight: 600; }
  #card .type { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  #card .desc { color: #c9ceda; margin: 10px 0 14px; }
  #card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
  #card dt { color: var(--muted); }
  #card dd { margin: 0; font-variant-numeric: tabular-nums; }
  #card dd.live { color: var(--accent); }
  #card .close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; cursor: pointer; font-size: 18px; color: var(--muted); }
  #card .close:hover { background: rgba(255,255,255,.08); color: var(--text); }

  #hint { position: fixed; bottom: 18px; left: 16px; color: rgba(255,255,255,.38); font-size: 12px; z-index: 4; pointer-events: none; }
  #hdStatus { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); color: var(--muted); font-size: 12px; z-index: 4; opacity: 0; transition: opacity .4s; pointer-events: none; }
  #hdStatus.show { opacity: 1; }

  /* Подписи */
  .label { pointer-events: auto; cursor: pointer; }
  .label > span {
    display: inline-flex; align-items: center; gap: 6px;
    transform: translate(calc(50% - 4px), 0);
    font-size: 12px; color: rgba(235, 238, 245, 0.82); text-shadow: 0 0 4px #000, 0 0 2px #000; white-space: nowrap;
    transition: color .2s;
  }
  .label > span::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid currentColor; opacity: 0.8; flex: none; }
  .label.moon > span { font-size: 11px; color: rgba(200, 205, 215, 0.7); }
  .label.hover > span { color: var(--accent); }

  /* Загрузка */
  #loader { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: #000; transition: opacity .8s; }
  #loader.done { opacity: 0; pointer-events: none; }
  #loader .inner { width: min(280px, 70vw); text-align: center; }
  #loader .title { font-size: 16px; letter-spacing: 0.04em; margin-bottom: 14px; }
  #loader .bar { height: 3px; background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
  #loader .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #loader .pct { margin-top: 10px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  #error { display: none; margin-top: 16px; color: #ff9a8a; font-size: 13px; }

  @media (max-width: 760px) {
    #header { top: 10px; left: 10px; padding: 8px 12px; }
    #header h1 { font-size: 14px; }
    #bodies { top: auto; bottom: 70px; left: 10px; right: 10px; width: auto; max-height: none; display: flex; overflow-x: auto; overflow-y: hidden; padding: 4px; }
    #bodies button, #bodies button.moon { width: auto; flex: none; padding: 6px 10px; }
    #settings { top: 72px; left: 10px; right: auto; max-width: calc(100% - 20px); padding: 5px; gap: 4px; flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; }
    .chip { padding: 5px 8px; font-size: 12px; }
    #time { bottom: 10px; left: 10px; right: 10px; transform: none; justify-content: space-between; }
    #speed { flex: 1; width: auto; min-width: 60px; }
    #speedLabel { min-width: 0; font-size: 12px; }
    #card { top: auto; bottom: 128px; left: 10px; right: 10px; width: auto; max-height: 36%; padding: 14px; }
    #card h2 { font-size: 18px; }
    #card .desc { display: none; }
    #card dl { margin-top: 10px; }
    #card.hidden { transform: translateY(24px); }
    #hint { display: none; }
  }
</style>
<!-- Модули грузим параллельно, а не цепочкой: браузер узнаёт о них сразу -->
<link rel="modulepreload" href="main.js">
<link rel="modulepreload" href="vendor/three.js">
<link rel="modulepreload" href="previews.js">
<link rel="modulepreload" href="data.js">
<link rel="modulepreload" href="shaders.js">
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>

<div id="header" class="panel">
  <h1>Солнечная система</h1>
  <div id="date">—</div>
</div>

<nav id="bodies" class="panel" aria-label="Объекты"></nav>

<div id="settings" class="panel">
  <button class="chip" id="btnOverview">Обзор</button>
  <button class="chip" id="btnOrbits" aria-pressed="true">Орбиты</button>
  <button class="chip" id="btnLabels" aria-pressed="true">Подписи</button>
  <button class="chip" id="btnScale" aria-pressed="false" title="Истинные размеры и расстояния">Реальный масштаб</button>
  <button class="chip" id="btnHD" aria-pressed="true" title="Загружать текстуры 8K при приближении">8K</button>
</div>

<aside id="card" class="panel hidden" aria-live="polite">
  <button class="close" id="cardClose" aria-label="Закрыть">×</button>
  <div class="type" id="cardType"></div>
  <h2 id="cardName"></h2>
  <p class="desc" id="cardDesc"></p>
  <dl id="cardFacts"></dl>
</aside>

<div id="time" class="panel">
  <button class="chip icon" id="btnReverse" title="Обратный ход времени">⇄</button>
  <button class="chip icon" id="btnPause" title="Пауза (пробел)">❚❚</button>
  <input type="range" id="speed" min="0" max="7" step="1" value="2" aria-label="Скорость времени">
  <span id="speedLabel"></span>
  <button class="chip" id="btnNow" title="Текущая дата, реальное время">Сейчас</button>
</div>

<div id="hdStatus"></div>
<div id="hint">Перетаскивание — вращение · колесо — масштаб · ПКМ — сдвиг · клик — выбрать · Esc — обзор</div>

<div id="loader">
  <div class="inner">
    <div class="title">Солнечная система</div>
        <div class="pct" id="loadPct">Загрузка…</div>
    <div id="error">Не удалось загрузить сцену. Откройте страницу через локальный сервер:<br><code>python3 -m http.server 8000</code></div>
  </div>
</div>

<script id="fileCheck">if (location.protocol === 'file:') document.getElementById('error').style.display = 'block';</script>
<script type="module" src="main.js"></script>
</body>
</html>
